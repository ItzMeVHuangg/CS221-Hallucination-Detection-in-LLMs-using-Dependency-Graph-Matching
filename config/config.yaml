project:
  name: "Hallucination Detection in LLMs via Hybrid Graph-NLI Matching"
  version: "2.0.0"
  seed: 42

data:
  dataset_name: "xsum"
  split: "test"           # test | validation | train
  num_samples: 200        # set null to use full split
  hallucination_annotations: "data/xsum_hallucination_annotations.json"  # optional

model:
  summarizer: "facebook/bart-large-xsum"   # local HF model
  # alternatives: "google/pegasus-xsum", "t5-base", "sshleifer/distilbart-xsum-12-6"
  device: "auto"          # auto | cpu | cuda | mps
  batch_size: 8
  max_input_length: 1024
  max_summary_length: 128
  num_beams: 4
  length_penalty: 2.0
  early_stopping: true

graph:
  spacy_model: "en_core_web_sm"   # en_core_web_sm | en_core_web_md | en_core_web_trf
  include_ner: true               # include Named Entities as special nodes
  include_svo: true               # extract Subject-Verb-Object triples
  min_node_freq: 1

# ─── Advanced NLP (v2) ────────────────────────────────────────────────────
nlp:
  enable_coref: true              # coreference resolution via fastcoref
  enable_nli: true                # NLI entailment scoring via DeBERTa
  nli_model: "cross-encoder/nli-deberta-v3-small"
  nli_max_length: 512
  enable_negation: true           # rule-based negation detection

# ─── Matching weights (must be tuned — see scripts/ablation_study.py) ────
matching:
  algorithm: "hybrid"             # svo | entity | subgraph | hybrid
  svo_weight: 0.30                # structural SVO recall
  entity_weight: 0.25             # entity recall
  lexical_weight: 0.15            # node overlap
  nli_weight: 0.30                # semantic NLI entailment (NEW)
  negation_penalty_w: 0.20        # penalty for negation mismatches (NEW)
  threshold: 0.50                 # below this => hallucination
  use_lemmatization: true
  use_fuzzy_match: true
  fuzzy_threshold: 80

evaluation:
  metrics:
    - "precision"
    - "recall"
    - "f1"
    - "auc_roc"
    - "accuracy"
  output_dir: "outputs/results"
  save_graphs: true
  graphs_dir: "outputs/graphs"
  summaries_dir: "outputs/summaries"

logging:
  level: "INFO"
  log_file: "outputs/run.log"
